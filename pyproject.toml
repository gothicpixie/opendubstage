[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendubstage"
version = "0.1.0.dev0"
description = "Open-source documentary and film sound post-production tools: spectral repair, dialogue EQ match, music carve, transitions, mix QC and restrained foley for stills."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
  "audio", "audio-processing", "sound post-production", "audio post-production", "documentary", "film sound",
  "dialogue editing", "dialogue repair", "spectral repair", "audio restoration", "noise reduction", "de-rumble",
  "EQ matching", "voice matching", "music ducking", "dynamic EQ", "J-cut", "L-cut",
  "loudness", "LUFS", "EBU R128", "BS.1770", "true peak", "broadcast QC", "podcast", "podcast mastering",
  "public radio", "foley", "sound design", "ffmpeg", "claude-code", "agent skills",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Editors",
  "Topic :: Multimedia :: Sound/Audio :: Mixers",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["numpy>=1.23", "scipy>=1.9", "soundfile>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "pyyaml>=6"]   # pyyaml: the skills/README.md self-check
# Local generative foley backend. Woosh itself is installed from source (scripts/install_woosh.sh); its weights
# are CC-BY-NC 4.0, see NOTICE.
woosh = ["torch", "torchaudio", "torchvision", "Pillow"]
# Apple Vision scene labels for foley (macOS only)
vision = ["pyobjc-framework-Vision; sys_platform == 'darwin'"]

[project.urls]
Homepage = "https://github.com/gothicpixie/opendubstage"
Documentation = "https://github.com/gothicpixie/opendubstage#readme"
Source = "https://github.com/gothicpixie/opendubstage"
Issues = "https://github.com/gothicpixie/opendubstage/issues"
Changelog = "https://github.com/gothicpixie/opendubstage/releases"
Roadmap = "https://github.com/gothicpixie/opendubstage/blob/main/ROADMAP.md"
"Agent skills" = "https://github.com/gothicpixie/opendubstage/tree/main/skills"

[project.scripts]
opendubstage = "opendubstage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["opendubstage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/foley"]
addopts = "-q"
